<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>VIJAY Educational Services</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        .video-page {
            width: 100%;
            height: 100dvh;
            min-height: 100vh;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .video-page video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            display: block;

            background: #000;
        }

        .overlay {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.15),
                    rgba(0,0,0,0.00),
                    rgba(0,0,0,0.15)
                );

            pointer-events: none;

            z-index: 2;
        }

        .top-logo {
            position: absolute;

            top: 35px;
            left: 50px;

            color: white;

            font-size: 24px;
            font-weight: 900;

            letter-spacing: 4px;

            z-index: 10;

            text-shadow:
                0 2px 10px rgba(0,0,0,0.8);
        }

        .skip-button {
            position: absolute;

            top: 35px;
            right: 35px;

            padding: 10px 20px;

            border:
                1px solid
                rgba(255,255,255,0.7);

            border-radius: 25px;

            color: white;

            background:
                rgba(0,0,0,0.30);

            cursor: pointer;

            z-index: 10;

            font-size: 13px;
            font-weight: 600;

            transition: all 0.3s ease;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .skip-button:hover {
            background: white;
            color: black;
            transform: translateY(-2px);
        }

        .sound-button {
            position: absolute;

            right: 35px;
            bottom: 35px;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.7);

            background:
                rgba(0,0,0,0.30);

            color: white;

            cursor: pointer;

            z-index: 10;

            font-size: 18px;

            transition: all 0.3s ease;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .sound-button:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }

        .progress {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 3px;

            background:
                rgba(255,255,255,0.25);

            z-index: 10;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background: white;

            transition:
                width 0.1s linear;
        }

        @media (max-width: 768px) {

            .video-page {
                height: 100dvh;
                min-height: 100vh;
            }

            .video-page video {
                width: 100%;
                height: 100%;

                object-fit: cover;
                object-position: center;
            }

            .top-logo {
                top: 20px;
                left: 20px;

                font-size: 19px;
                letter-spacing: 3px;
            }

            .skip-button {
                top: 18px;
                right: 18px;

                padding: 8px 15px;

                font-size: 11px;

                border-radius: 20px;
            }

            .sound-button {
                right: 18px;
                bottom: 25px;

                width: 44px;
                height: 44px;

                font-size: 16px;
            }

            .progress {
                height: 3px;
            }
        }

        @media (max-width: 480px) {

            .top-logo {
                top: 18px;
                left: 16px;

                font-size: 17px;
            }

            .skip-button {
                top: 15px;
                right: 15px;

                padding: 7px 13px;

                font-size: 10px;
            }

            .sound-button {
                right: 15px;
                bottom: 22px;

                width: 42px;
                height: 42px;
            }
        }

        @media (orientation: landscape) and (max-height: 600px) {

            .top-logo {
                top: 15px;
                left: 20px;

                font-size: 18px;
            }

            .skip-button {
                top: 15px;
                right: 20px;

                padding: 7px 14px;
            }

            .sound-button {
                right: 20px;
                bottom: 18px;

                width: 40px;
                height: 40px;
            }
        }

    </style>

</head>

<body>

    <div class="video-page">

        <video
            id="introVideo"
            autoplay
            muted
            playsinline
            webkit-playsinline
            preload="auto"
        >

            <source
                src="{{ url_for('static', filename='videos/vijay-intro.mp4') }}"
                type="video/mp4"
            >

        </video>


        <div class="overlay"></div>


        <div class="top-logo">
            VIJAY
        </div>


        <button
            type="button"
            class="skip-button"
            onclick="goHome()"
        >
            Skip Intro
        </button>


        <button
            type="button"
            class="sound-button"
            id="soundButton"
            onclick="toggleSound()"
        >
            🔇
        </button>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>

    </div>


    <script>

        const video =
            document.getElementById(
                "introVideo"
            );

        const progressBar =
            document.getElementById(
                "progressBar"
            );

        const soundButton =
            document.getElementById(
                "soundButton"
            );


        video.addEventListener(
            "timeupdate",
            function () {

                if (
                    video.duration &&
                    !isNaN(video.duration)
                ) {

                    const percentage =
                        (
                            video.currentTime /
                            video.duration
                        ) * 100;

                    progressBar.style.width =
                        percentage + "%";

                }

            }
        );


        video.addEventListener(
            "ended",
            function () {

                goHome();

            }
        );


        function toggleSound() {

            if (video.muted) {

                video.muted = false;

                soundButton.innerHTML = "🔊";

            } else {

                video.muted = true;

                soundButton.innerHTML = "🔇";

            }

        }


        function goHome() {

            window.location.href =
                "{{ url_for('main_home') }}";

        }


        function startVideo() {

            const playPromise =
                video.play();

            if (
                playPromise !== undefined
            ) {

                playPromise.catch(
                    function () {
                    }
                );

            }

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                startVideo
            );

        } else {

            startVideo();

        }

    </script>

</body>

</html>
