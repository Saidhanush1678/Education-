<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VIJAY Educational Services</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
        }

        .loader {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background:
                radial-gradient(
                    circle at center,
                    #12345a 0%,
                    #07111f 55%,
                    #02060b 100%
                );
        }

        .loader-content {
            text-align: center;
            color: white;
            z-index: 5;
        }

        .logo {
            width: 110px;
            height: 110px;
            margin: auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #ffffff,
                #dceeff
            );

            color: #0b3764;

            font-size: 34px;
            font-weight: 800;

            box-shadow:
                0 0 20px rgba(255,255,255,0.3),
                0 0 60px rgba(52,152,219,0.35);

            animation: logoPulse 2s infinite;
        }

        .brand {
            margin-top: 28px;

            font-size: 42px;
            font-weight: 800;

            letter-spacing: 7px;
        }

        .subtitle {
            margin-top: 12px;

            font-size: 15px;
            letter-spacing: 3px;

            color: #b9d8f5;
        }

        .loading-area {
            margin-top: 45px;
        }

        .loading-text {
            font-size: 13px;
            letter-spacing: 2px;

            color: #d8e9f8;

            margin-bottom: 15px;
        }

        .progress-container {
            width: 280px;
            height: 5px;

            background: rgba(255,255,255,0.15);

            border-radius: 20px;

            overflow: hidden;

            margin: auto;
        }

        .progress {
            width: 0%;
            height: 100%;

            background: #ffffff;

            border-radius: 20px;

            animation: progress 4s linear forwards;
        }

        .dots {
            margin-top: 18px;
        }

        .dots span {
            display: inline-block;

            width: 7px;
            height: 7px;

            margin: 0 4px;

            border-radius: 50%;

            background: white;

            animation: dots 1.4s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .circle {
            position: absolute;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.08);
        }

        .circle.one {
            width: 350px;
            height: 350px;

            animation:
                rotate
                15s
                linear
                infinite;
        }

        .circle.two {
            width: 550px;
            height: 550px;

            animation:
                rotateReverse
                20s
                linear
                infinite;
        }

        .circle.three {
            width: 800px;
            height: 800px;

            animation:
                rotate
                30s
                linear
                infinite;
        }

        .skip {
            position: absolute;

            bottom: 30px;
            right: 35px;

            color: rgba(255,255,255,0.7);

            font-size: 12px;

            cursor: pointer;

            z-index: 10;

            border:
                1px solid
                rgba(255,255,255,0.25);

            padding:
                10px
                18px;

            border-radius: 30px;

            transition: 0.3s;
        }

        .skip:hover {
            color: white;

            border-color: white;

            background:
                rgba(255,255,255,0.08);
        }

        @keyframes progress {

            from {
                width: 0%;
            }

            to {
                width: 100%;
            }

        }

        @keyframes logoPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

        }

        @keyframes dots {

            0%,
            80%,
            100% {
                transform: scale(0.5);
                opacity: 0.4;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }

        }

        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        @keyframes rotateReverse {

            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }

        }

        @media (max-width: 600px) {

            .brand {
                font-size: 30px;
                letter-spacing: 5px;
            }

            .subtitle {
                font-size: 11px;
            }

            .logo {
                width: 90px;
                height: 90px;

                font-size: 28px;
            }

            .progress-container {
                width: 220px;
            }

            .circle.one {
                width: 250px;
                height: 250px;
            }

            .circle.two {
                width: 400px;
                height: 400px;
            }

            .circle.three {
                width: 550px;
                height: 550px;
            }

            .skip {
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="loader">

        <div class="circle one"></div>

        <div class="circle two"></div>

        <div class="circle three"></div>

        <div class="loader-content">

            <div class="logo">
                VE
            </div>

            <div class="brand">
                VIJAY
            </div>

            <div class="subtitle">
                EDUCATIONAL SERVICES
            </div>

            <div class="loading-area">

                <div class="loading-text">
                    Preparing your learning experience
                </div>

                <div class="progress-container">

                    <div class="progress"></div>

                </div>

                <div class="dots">

                    <span></span>

                    <span></span>

                    <span></span>

                </div>

            </div>

        </div>

        <div
            class="skip"
            onclick="goToIntro()"
        >
            Skip
        </div>

    </div>

    <script>

        function goToIntro() {

            window.location.href =
                "{{ url_for('intro') }}";

        }

        setTimeout(function () {

            window.location.href =
                "{{ url_for('intro') }}";

        }, 4200);

    </script>

</body>
</html>
